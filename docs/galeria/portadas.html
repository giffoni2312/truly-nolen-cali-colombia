body{font:16px system-ui;margin:0;padding:20px 24px 60px;background:#f7f6f1;color:#1b222b}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:24px}

<h1>Portada de Truly Nolen Cali: elige una</h1>
<p class="sub">El mismo carro oficial de Truly, con fondos de Cali creados con IA (no usan fotos de nadie). Haz clic en una imagen para verla en grande.</p>
<div class="grid">
<figure><a href="portadas/portada-1.jpg" target="_blank"><img src="portadas/portada-1.jpg" alt=""></a><figcaption><b>1</b> Cristo Rey<small>Avenida con palmas reales y el Cristo Rey en el cerro.</small></figcaption></figure>
<figure><a href="portadas/portada-2.jpg" target="_blank"><img src="portadas/portada-2.jpg" alt=""></a><figcaption><b>2</b> Farallones de Cali<small>Vía amplia hacia Pance con los Farallones al fondo.</small></figcaption></figure>
<figure><a href="portadas/portada-3.jpg" target="_blank"><img src="portadas/portada-3.jpg" alt=""></a><figcaption><b>3</b> Skyline de Cali<small>Avenida moderna con los edificios de Cali y los cerros.</small></figcaption></figure>
<figure><a href="portadas/portada-4.jpg" target="_blank"><img src="portadas/portada-4.jpg" alt=""></a><figcaption><b>4</b> La Ermita<small>Avenida junto al río Cali con la iglesia La Ermita.</small></figcaption></figure>
<figure><a href="portadas/portada-5.jpg" target="_blank"><img src="portadas/portada-5.jpg" alt=""></a><figcaption><b>5</b> Bandera de Cali<small>Entrada sur con la bandera gigante (los colores de la bandera no salieron fieles).</small></figcaption></figure>
<figure><a href="portadas/portada-6.jpg" target="_blank"><img src="portadas/portada-6.jpg" alt=""></a><figcaption><b>6</b> Gato del Río<small>Avenida junto al río Cali con esculturas de gatos (la IA no las hizo idénticas al Gato de Tejada real).</small></figcaption></figure>
<figure><a href="portadas/portada-7.jpg" target="_blank"><img src="portadas/portada-7.jpg" alt=""></a><figcaption><b>7</b> Sebastián de Belalcázar<small>Vía en la colina con la estatua que señala la ciudad.</small></figcaption></figure>
<figure><a href="portadas/portada-8.jpg" target="_blank"><img src="portadas/portada-8.jpg" alt=""></a><figcaption><b>8</b> San Antonio<small>Calle del barrio San Antonio con su capilla y casas coloniales, al atardecer.</small></figcaption></figure>
<figure><a href="portadas/portada-9.jpg" target="_blank"><img src="portadas/portada-9.jpg" alt=""></a><figcaption><b>9</b> Tres Cruces<small>Avenida al pie del Cerro de las Tres Cruces.</small></figcaption></figure>
<figure><a href="portadas/portada-10.jpg" target="_blank"><img src="portadas/portada-10.jpg" alt=""></a><figcaption><b>10</b> Torre de Cali<small>Bulevar moderno con la Torre de Cali y los cerros (aquí el carro quedó un poco más chico).</small></figcaption></figure>
<figure><a href="portadas/portada-11.jpg" target="_blank"><img src="portadas/portada-11.jpg" alt=""></a><figcaption><b>11</b> Avenida Sexta de noche<small>La Sexta al atardecer con luces de restaurantes y palmeras.</small></figcaption></figure>
